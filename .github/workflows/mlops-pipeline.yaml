# .github/workflows/mlops-pipeline.yaml
name: MLOps Training Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests with pytest
      run: pytest tests/

  train-and-register-model:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Set up MLflow Server
      run: |
        docker run -d -p 5000:5000 --name mlflow-server ghcr.io/mlflow/mlflow:v2.14.1 mlflow server --host 0.0.0.0
        
    - name: Wait for MLflow to start
      run: |
        sleep 10
        curl -f http://localhost:5000/health
        
    - name: Train model and register in MLflow
      run: |
        python src/models/train_model.py --config configs/model_config.yaml --mlflow-tracking-uri http://localhost:5000
        
    - name: Upload trained model
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: models/trained/good_bad_applicant_model.pkl
        
    - name: Clean up MLflow
      if: always()
      run: |
        docker stop mlflow-server || true
        docker rm mlflow-server || true
        
  build-and-publish-api:
    needs: train-and-register-model
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download trained model
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: models/trained/
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push API Docker image
      uses: docker/build-push-action@v5
      with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/good-bad-applicant-api:latest

  build-and-publish-streamlit:
    needs: train-and-register-model
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Streamlit Docker image
      uses: docker/build-push-action@v5
      with:
          context: .
          file: ./Dockerfile.streamlit
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/good-bad-applicant-streamlit:latest
